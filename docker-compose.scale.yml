services:
  backend:
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}

  nginx:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstreams.conf.template:/etc/nginx/templates/upstreams.conf.template:ro

    environment:
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template